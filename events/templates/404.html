<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1a103e, #3e2c8d);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: #111;
            padding: 40px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow:
                0 0 5px rgba(0, 153, 255, 0.8),
                0 0 8px rgba(0, 153, 255, 0.6),
                0 0 15px rgba(0, 153, 255, 0.4);
        }

        h1 {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        p {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .inspect-div {
            text-align: center;
        }
        
        .inspect {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background-color: #aaa;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            transition: 0.3s ease-in-out;
        }
        
        .inspect:hover {
            background-color: #999;
            box-shadow: 0 6px 12px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>404</h1>
        <p>Oops! The page you're looking for doesn't exist.</p>
        <div class="inspect-div">
            <a class="inspect" href="/">
              home
            </a>
          </div>
    </div>
</body>

</html>
